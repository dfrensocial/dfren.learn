# Netlify auto-detects Next.js and applies its OpenNext adapter; this just
# pins the build so it doesn't depend on UI settings.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # firebase-admin lists @google-cloud/firestore as an OPTIONAL dependency,
  # and that package itself requires Node >=22 -- on Node 20, npm silently
  # skips installing it rather than erroring, so our code (which imports it
  # unconditionally via firebase-admin/firestore) crashed at runtime with
  # "Cannot find module '@google-cloud/firestore'". Node 22 satisfies its
  # engines requirement, so npm actually installs it.
  NODE_VERSION = "22"

  # Netlify's secrets scanner fails the build if any env var value shows up in
  # the output. Two expected, harmless cases:
  #  1. NEXT_PUBLIC_* values and the Razorpay key *id* are public by design --
  #     they're inlined into the client bundle (and Firebase's project id is
  #     in .firebaserc / legal copy).
  #  2. Turbopack's build cache (.netlify/.next/cache) snapshots process.env.
  #     It's a build artifact, never published or bundled into the function.
  # Everything else stays scanned, so a real secret leaking into the shipped
  # bundle or the repo still fails the build. (Verified: no private/secret
  # value appears in the built output or tracked files.)
  SECRETS_SCAN_OMIT_PATHS = ".netlify/.next/cache/**"
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_FIREBASE_API_KEY,NEXT_PUBLIC_FIREBASE_APP_ID,NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN,NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID,NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID,NEXT_PUBLIC_FIREBASE_PROJECT_ID,NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET,NEXT_PUBLIC_RAZORPAY_KEY_ID,RAZORPAY_KEY_ID,FIREBASE_PROJECT_ID"

  # NODE_VERSION above only controls the *build*. The deployed function runs on
  # AWS Lambda's own runtime, which must also be new enough for require(esm):
  # firebase-admin -> jwks-rsa@4 require()s jose@6 (ESM-only), which needs
  # Node >= 20.19 / 22.12. On an older Lambda runtime every route that imports
  # firebase-admin crashes at load with ERR_REQUIRE_ESM (500, empty body).
  AWS_LAMBDA_JS_RUNTIME = "nodejs22.x"
