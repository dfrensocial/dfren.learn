# Netlify auto-detects Next.js and applies its OpenNext adapter; this just
# pins the build so it doesn't depend on UI settings.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # firebase-admin lists @google-cloud/firestore as an OPTIONAL dependency,
  # and that package itself requires Node >=22 -- on Node 20, npm silently
  # skips installing it rather than erroring, so our code (which imports it
  # unconditionally via firebase-admin/firestore) crashed at runtime with
  # "Cannot find module '@google-cloud/firestore'". Node 22 satisfies its
  # engines requirement, so npm actually installs it.
  NODE_VERSION = "22"
